name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Unit tests
        run: cargo test --release
      - name: Build (compiles llama.cpp, and the Objective-C IOReport module on macOS)
        run: cargo build --release
      - name: Smoke run on a tiny model
        shell: bash
        run: |
          mkdir -p models
          base=https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main
          for q in f16 Q4_K_M; do curl -sSL -o models/SmolLM2-135M-Instruct-$q.gguf $base/SmolLM2-135M-Instruct-$q.gguf; done
          ./target/release/bitrot compare models/SmolLM2-135M-Instruct-f16.gguf models/SmolLM2-135M-Instruct-Q4_K_M.gguf \
            --max-tokens 128 --gen-tokens 16 --out ci-out
          test -s ci-out/report.html
