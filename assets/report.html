<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kldrift report</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #17181c; --muted: #6b6e78; --line: #e4e2dc;
  --accent: #0f766e; --warn: #b45309; --bad: #b91c1c; --good: #15803d;
  --heat: 185, 28, 28; --chip: #efede7;
  --c0: #2563eb; --c1: #d97706; --c2: #059669; --c3: #db2777; --c4: #7c3aed; --c5: #0891b2; --c6: #65a30d; --c7: #dc2626;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f12; --panel: #16181d; --ink: #e8e8ea; --muted: #8b8f9a; --line: #262931;
    --accent: #2dd4bf; --warn: #f59e0b; --bad: #f87171; --good: #4ade80;
    --heat: 248, 113, 113; --chip: #1f2229;
    --c0: #60a5fa; --c1: #fbbf24; --c2: #34d399; --c3: #f472b6; --c4: #a78bfa; --c5: #22d3ee; --c6: #a3e635; --c7: #f87171;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f12; --panel: #16181d; --ink: #e8e8ea; --muted: #8b8f9a; --line: #262931;
  --accent: #2dd4bf; --warn: #f59e0b; --bad: #f87171; --good: #4ade80;
  --heat: 248, 113, 113; --chip: #1f2229;
  --c0: #60a5fa; --c1: #fbbf24; --c2: #34d399; --c3: #f472b6; --c4: #a78bfa; --c5: #22d3ee; --c6: #a3e635; --c7: #f87171;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 80px; }
h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 48px 0 14px; font-weight: 600; }
.sub { color: var(--muted); margin-top: 6px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.brand { font-family: var(--mono); color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
.theme { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.fact { background: var(--chip); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--muted); }
.fact b { color: var(--ink); font-weight: 600; }

.verdict { margin-top: 28px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; border-left: 4px solid var(--good); }
.verdict .big { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--good); }
.verdict p { margin: 2px 0 0; color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 10px 10px; white-space: nowrap; }
td { text-align: right; padding: 10px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.scroll { overflow-x: auto; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
.tier { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
.t-near_lossless { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.t-excellent { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
.t-noticeable { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.t-degraded { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.t-reference { background: var(--chip); color: var(--muted); }
.pareto { color: var(--accent); font-size: 11px; margin-left: 6px; }
.kbar { display: inline-block; height: 6px; border-radius: 3px; background: rgba(var(--heat), 0.85); vertical-align: middle; margin-left: 8px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .verdict { grid-template-columns: 1fr; } }
.chart-title { font-weight: 600; margin: 0 0 2px; }
.chart-note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
svg text { fill: var(--muted); font: 11px var(--sans); }
svg .lbl { fill: var(--ink); font-weight: 600; }
svg .axis { stroke: var(--line); }
svg .grid { stroke: var(--line); stroke-dasharray: 2 4; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 14px; max-width: 100%; }
.legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-left: auto; }
.ramp { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(var(--heat), 0.04), rgba(var(--heat), 0.9)); }
.text { font-family: var(--mono); font-size: 13.5px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; max-height: 520px; overflow-y: auto; padding-right: 6px; }
.tok { border-radius: 3px; cursor: default; }
.tok:empty { display: inline-block; min-width: 3px; height: 1.1em; vertical-align: -2px; }
.tok.f1 { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--warn) 70%, transparent); }
.tok.f2 { box-shadow: inset 0 -2px 0 var(--bad); }
.tok:hover { outline: 1.5px solid var(--ink); }
.nl { color: var(--muted); opacity: 0.5; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.25); font-size: 12.5px; width: 380px; max-width: calc(100vw - 24px); display: none; }
.tipgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
.alt { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; margin: 3px 0; font-family: var(--mono); }
.alt .w { white-space: pre; overflow: hidden; text-overflow: ellipsis; background: var(--chip); padding: 0 4px; border-radius: 3px; }
.alt .w.hit { outline: 1px solid var(--accent); }
.alt .p { color: var(--muted); font-size: 11.5px; }
.pbar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--accent); opacity: 0.7; margin-top: -2px; }
.muted { color: var(--muted); }

.worst { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.wcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 13px; }
.wcard .ctx { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
.wcard .ctx mark { background: rgba(var(--heat), 0.25); color: var(--ink); border-radius: 3px; padding: 0 2px; }
.wcard .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
footer { margin-top: 56px; color: var(--muted); font-size: 13px; line-height: 1.6; }
footer code { font-family: var(--mono); background: var(--chip); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip"></div>
<script>
const DATA = /*__KLDRIFT_DATA__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const color = i => `var(--c${i % 8})`;
const gb = b => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB";
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const fmtKL = x => x < 0.001 ? x.toExponential(1) : x.toFixed(4);
const TIER = { near_lossless: "near-lossless", excellent: "excellent", noticeable: "noticeable", degraded: "degraded" };
const showPiece = s => s.replace(/\n/g, "↵").replace(/\t/g, "⇥") || "‹partial char›";
function niceTicks(max, n = 4) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const t = []; for (let v = 0; v <= max + 1e-9; v += step) t.push(v);
  return t;
}

function nice(n) { return n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2); }

function render() {
  const D = DATA, R = D.reference, C = D.candidates;
  const ref = R.info.size_bytes || 1;
  const anyBench = [R, ...C.map(c => c.model)].some(m => m.bench);
  const energy = D.energy_available && [R, ...C.map(c => c.model)].some(m => m.bench && m.bench.energy_mj_per_tok != null);
  const rec = D.recommendation;
  const recC = rec && C.find(c => c.model.spec.name === rec.name);

  let h = `
  <header>
    <div>
      <div class="brand">KLDRIFT · v${esc(D.version)}</div>
      <h1>How far do the quants drift from ${esc(R.spec.name)}?</h1>
      <div class="sub">${C.length} quantized version${C.length > 1 ? "s" : ""} compared token-by-token against the reference on ${D.docs.length} prompts</div>
      <div class="facts">
        <span class="fact"><b>${esc(D.machine.chip || D.machine.arch)}</b></span>
        ${D.machine.memory_bytes ? `<span class="fact"><b>${gb(D.machine.memory_bytes)}</b> memory</span>` : ""}
        <span class="fact">${esc(D.machine.os)}</span>
        <span class="fact"><b>${(C[0] ? C[0].summary.n_tokens : 0).toLocaleString()}</b> tokens scored</span>
        <span class="fact">ctx <b>${D.settings.ctx}</b> · top-k <b>${D.settings.top_k}</b></span>
        <span class="fact">${esc(D.created)}</span>
      </div>
    </div>
    <button class="theme" id="theme">◐ theme</button>
  </header>`;

  if (recC) {
    h += `<div class="panel verdict">
      <div class="big">${esc(rec.name)}</div>
      <div><b>Use this one.</b>${D.stats ? (() => { const st = D.stats.stability.find(x => x[0] === rec.name); return st ? ` <span class="tier ${st[1] >= 0.8 ? "t-near_lossless" : "t-noticeable"}">same pick in ${pct(st[1], 0)} of resamples</span>` : ""; })() : ""}
      ${gb(recC.model.info.size_bytes)} (${pct(recC.model.info.size_bytes / ref, 0)} of the reference),
      mean KL ${fmtKL(recC.summary.kl_mean)}, picks the same next token as the reference ${pct(recC.summary.top1_agreement)} of the time.
      <p>${esc(rec.reason)}</p></div></div>`;
  }

  // ---- summary table ----
  h += `<h2>Summary</h2><div class="panel scroll"><table><thead><tr>
    <th>model</th><th>size</th><th>KL mean</th><th>KL p99</th><th>top-1 agree</th><th>confident flips</th><th>PPL</th>
    ${anyBench ? "<th>prefill t/s</th><th>decode t/s</th><th>memory</th>" : ""}
    ${energy ? "<th>energy / token</th>" : ""}<th>quality</th></tr></thead><tbody>`;
  const maxKL = Math.max(...C.map(c => c.summary.kl_mean), 1e-9);
  const benchCells = m => anyBench ? (m.bench
      ? `<td class="mono">${nice(m.bench.prefill_tok_s)}</td><td class="mono">${nice(m.bench.decode_tok_s)}</td><td class="mono">${m.bench.mem_bytes ? gb(m.bench.mem_bytes) : "–"}</td>`
      : "<td>–</td><td>–</td><td>–</td>") : "";
  const energyCell = m => energy ? `<td class="mono">${m.bench && m.bench.energy_mj_per_tok != null ? m.bench.energy_mj_per_tok.toFixed(1) + " mJ" : "–"}</td>` : "";
  h += `<tr><td><span class="swatch" style="background:var(--muted)"></span><b>${esc(R.spec.name)}</b></td>
    <td class="mono">${gb(R.info.size_bytes)}</td><td class="mono muted">0</td><td class="mono muted">0</td><td class="mono muted">100%</td><td class="mono muted">0</td>
    <td class="mono">${R.ppl.toFixed(3)}</td>${benchCells(R)}${energyCell(R)}<td><span class="tier t-reference">reference</span></td></tr>`;
  C.forEach((c, i) => {
    const s = c.summary;
    h += `<tr><td><span class="swatch" style="background:${color(i)}"></span><b>${esc(c.model.spec.name)}</b>${c.pareto ? '<span class="pareto" title="Pareto-optimal: nothing else is both smaller and closer">◆ pareto</span>' : ""}</td>
      <td class="mono">${gb(c.model.info.size_bytes)} <span class="muted">${pct(c.model.info.size_bytes / ref, 0)}</span></td>
      <td class="mono">${fmtKL(s.kl_mean)}<span class="kbar" style="width:${Math.max(2, 60 * s.kl_mean / maxKL)}px"></span></td>
      <td class="mono">${s.kl_p99.toFixed(3)}</td>
      <td class="mono">${pct(s.top1_agreement)}</td>
      <td class="mono">${s.confident_flips}</td>
      <td class="mono">${s.ppl_cand.toFixed(3)} <span class="muted">${s.ppl_delta_pct >= 0 ? "+" : ""}${s.ppl_delta_pct.toFixed(2)}%</span></td>
      ${benchCells(c.model)}${energyCell(c.model)}
      <td><span class="tier t-${c.tier}">${TIER[c.tier]}</span></td></tr>`;
  });
  h += `</tbody></table></div>`;

  // ---- uncertainty ----
  const ST = D.stats;
  if (ST) {
    const ciKL = i => `${fmtKL(i.est)} <span class="muted">[${fmtKL(i.lo)} – ${fmtKL(i.hi)}]</span>`;
    const ciP = i => `${pct(i.est)} <span class="muted">[${pct(i.lo)} – ${pct(i.hi)}]</span>`;
    const sig = i => i.lo > 0 || i.hi < 0
      ? '<span class="tier t-degraded">real difference</span>'
      : '<span class="tier t-reference">could be noise</span>';
    const diff = (i, f) => `${f(i.est)} <span class="muted">[${f(i.lo)}, ${f(i.hi)}]</span>`;
    const sKL = v => (v >= 0 ? "+" : "") + fmtKL(Math.abs(v)).replace(/^/, v < 0 ? "−" : "");
    const sP = v => (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(0) + "%";
    h += `<h2>How sure are we?</h2><div class="panel">
      <p class="chart-title">${pct(ST.level, 0)} bootstrap intervals</p>
      <p class="chart-note">${ST.replicates} resamples of the data: prompt tokens in blocks of ${ST.block_tokens} (neighbouring tokens are not independent), tasks one by one.
      All quants are measured on the same resample, so comparisons are paired. A difference whose interval excludes zero is unlikely to be noise.</p>
      <div class="scroll"><table><thead><tr><th>model</th><th>KL mean</th><th>top-1 agree</th>${ST.candidates[0] && ST.candidates[0].accuracy ? "<th>correct answers</th>" : ""}${ST.candidates[0] && ST.candidates[0].p_change ? "<th>answers expected to change</th>" : ""}</tr></thead><tbody>
      ${ST.candidates.map((c, i) => `<tr><td><span class="swatch" style="background:${color(i)}"></span><b>${esc(c.name)}</b></td><td class="mono">${ciKL(c.kl_mean)}</td><td class="mono">${ciP(c.top1)}</td>${c.accuracy ? `<td class="mono">${ciP(c.accuracy)}</td>` : ""}${c.p_change ? `<td class="mono">${ciP(c.p_change)}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>
      <p class="chart-title" style="margin-top:22px">Is the smaller quant really worse?</p>
      <div class="scroll"><table><thead><tr><th>comparison</th><th>Δ KL mean</th><th></th>${ST.pairs[0] && ST.pairs[0].acc_diff ? "<th>Δ correct answers</th><th></th>" : ""}</tr></thead><tbody>
      ${ST.pairs.map(p => `<tr><td><b>${esc(p.smaller)}</b> <span class="muted">vs</span> <b>${esc(p.larger)}</b></td><td class="mono">${diff(p.kl_diff, sKL)}</td><td>${sig(p.kl_diff)}</td>${p.acc_diff ? `<td class="mono">${diff(p.acc_diff, sP)}</td><td>${sig(p.acc_diff)}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>
      <p class="chart-title" style="margin-top:22px">How stable is the recommendation?</p>
      <p class="chart-note">The whole decision, including re-fitting the calibrated tiers, re-run on every resample.</p>
      <div style="display:flex;border-radius:6px;overflow:hidden;height:26px">${ST.stability.map(([n, f]) => {
        const i = C.findIndex(c => c.model.spec.name === n);
        return `<div title="${esc(n)}: ${pct(f)}" style="width:${f * 100}%;background:${i >= 0 ? color(i) : "var(--line)"};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap">${f > 0.08 ? `${esc(n)} ${pct(f, 0)}` : ""}</div>`;
      }).join("")}</div>
      ${ST.kl_at ? `<div class="facts" style="margin-top:14px">${["near-lossless", "excellent", "noticeable"].map((t, i) => `<span class="fact">${t} below <b class="mono">KL ${fmtKL(ST.kl_at[i].est)}</b> <span class="mono">[${fmtKL(ST.kl_at[i].lo)} – ${fmtKL(ST.kl_at[i].hi)}]</span></span>`).join("")}</div>` : ""}
    </div>`;
  }

  // ---- charts ----
  h += `<h2>Trade-offs</h2><div class="grid2">
    <div class="panel"><p class="chart-title">Quality vs size</p><p class="chart-note">Lower is closer to the reference. The line joins the Pareto-optimal quants.</p><div id="scatter"></div></div>
    <div class="panel"><p class="chart-title">Where the drift lives</p><p class="chart-note">Share of tokens whose KL is at most x. A curve further left means fewer surprises.</p><div id="cdf"></div></div>
  </div>`;
  if (C[0] && C[0].by_category.length > 1) {
    h += `<h2>By content type</h2><div class="panel"><p class="chart-title">Mean KL per category</p><p class="chart-note">Quantization rarely hurts everything equally. This is where each quant breaks first.</p><div id="cats"></div></div>`;
  }

  // ---- tasks ----
  const T = D.tasks;
  if (T) {
    const rs = T.summary[R.spec.name];
    h += `<h2>Answers on real tasks</h2><div class="panel">
      <p class="chart-title">Does it still answer the same?</p>
      <p class="chart-note">Every model answers ${T.items.length} questions with known solutions (greedy decoding, up to ${T.gen_tokens} tokens), all from the exact same prompt tokens.
      <b>Broken</b> = the original was right and the quant was wrong. <b>Identical</b> = token-for-token the same output as the original.</p>
      <div class="scroll"><table><thead><tr><th>model</th><th>correct</th><th>broken</th><th>fixed</th><th>identical output</th><th>first difference after</th><th style="text-align:left;padding-left:24px">outputs vs. original</th></tr></thead><tbody>
      <tr><td><span class="swatch" style="background:var(--muted)"></span><b>${esc(R.spec.name)}</b></td><td class="mono">${rs.correct}/${rs.n}</td><td class="muted">–</td><td class="muted">–</td><td class="muted">–</td><td class="muted">–</td><td></td></tr>`;
    C.forEach((c, i) => {
      const s = T.summary[c.model.spec.name]; if (!s) return;
      const runs = T.runs[c.model.spec.name], ref = T.runs[R.spec.name];
      const same = s.identical, broken = s.regressions, fixed = s.fixes, other = s.n - same - broken - fixed;
      const seg = (n, col, label) => n ? `<span title="${label}: ${n}" style="display:inline-block;height:10px;width:${n / s.n * 180}px;background:${col}"></span>` : "";
      h += `<tr><td><span class="swatch" style="background:${color(i)}"></span><b>${esc(c.model.spec.name)}</b></td>
        <td class="mono">${s.correct}/${s.n}</td>
        <td class="mono" style="color:${broken ? "var(--bad)" : "var(--good)"}">${broken}</td>
        <td class="mono">${fixed}</td>
        <td class="mono">${pct(same / s.n, 0)}</td>
        <td class="mono">${s.median_diverge == null ? "never" : "~" + s.median_diverge.toFixed(0) + " tokens"}</td>
        <td style="text-align:left;padding-left:24px"><span style="display:inline-flex;border-radius:3px;overflow:hidden">${seg(same, "var(--accent)", "identical")}${seg(other, "var(--line)", "different text, same verdict")}${seg(fixed, "var(--good)", "fixed")}${seg(broken, "var(--bad)", "broken")}</span></td></tr>`;
    });
    h += `</tbody></table></div>
      <div class="controls" style="margin-top:22px">
        <select id="tcand">${C.map((c, i) => `<option value="${i}">${esc(c.model.spec.name)}</option>`).join("")}</select>
        <select id="tfilter"><option value="changed">answer verdict changed</option><option value="diff">output differs</option><option value="all">all tasks</option></select>
        <span class="muted" id="tcount" style="font-size:13px"></span>
      </div>
      <div class="tasks" id="tasklist"></div></div>`;
  }

  // ---- calibration ----
  const CAL = D.calibration;
  if (CAL) {
    h += `<h2>Calibrated quality tiers</h2><div class="panel">
      <p class="chart-title">How much drift does it take before answers change?</p>
      <p class="chart-note">Each dot is one task answered by one quant: its KL on the original's answer (x) and whether the ${esc(CAL.outcome.replace("answer ", ""))} (top row) or not (bottom row).
      The curve is a logistic fit, P(change) = σ(${CAL.a.toFixed(2)} + ${CAL.b.toFixed(2)}·ln KL), on ${CAL.n} answers. The tier boundaries in this report are where it crosses
      ${CAL.levels.map(p => pct(p, 0)).join(", ")}, so they are fitted to this model rather than picked by hand.</p>
      <div id="calib"></div>
      <div class="facts" style="margin-top:6px">${CAL.levels.map((p, i) => `<span class="fact">${pct(p, 0)} of answers change at <b class="mono">KL ${fmtKL(CAL.kl_at[i])}</b></span>`).join("")}</div>
    </div>`;
  } else if (D.calibration_note) {
    h += `<p class="muted" style="font-size:13px;margin-top:18px">Tiers use the default thresholds: ${esc(D.calibration_note)}.</p>`;
  }

  // ---- token explorer ----
  h += `<h2>Token explorer</h2><div class="panel">
    <div class="controls">
      <select id="doc">${D.docs.map((d, i) => `<option value="${i}">${esc(d.category)} / ${esc(d.name)}</option>`).join("")}</select>
      <select id="cand">${C.map((c, i) => `<option value="${i}">${esc(c.model.spec.name)}</option>`).join("")}</select>
      <div class="legend">KL <span class="ramp"></span> · <span style="box-shadow: inset 0 -2px 0 var(--bad)">&nbsp;flip&nbsp;</span> top token changed</div>
    </div>
    <div class="text" id="text"></div>
  </div>`;

  // ---- worst tokens ----
  h += `<h2>Biggest disagreements</h2><div class="controls"><select id="wcand">${C.map((c, i) => `<option value="${i}">${esc(c.model.spec.name)}</option>`).join("")}</select></div><div class="worst" id="worst"></div>`;

  h += `<footer>
    <b>Method.</b> Every prompt is run through the reference with teacher forcing. At each position its top-${D.settings.top_k} tokens are kept;
    each quant is then asked for its probabilities on exactly those tokens, and the rest of the vocabulary is pooled into one tail bucket on both sides.
    The KL divergence of these (k+1)-bucket distributions is a lower bound on the full-vocabulary KL and is tight when the reference tail is small.
    <i>Top-1 agreement</i> counts positions where both models rank the same token first; a <i>confident flip</i> is a disagreement where the reference was over 50% sure.
    ${energy ? `Energy is SoC package energy (CPU + GPU + ANE + DRAM) from IOReport during decoding, minus the idle baseline of ${D.idle_watts ? D.idle_watts.toFixed(2) + " W" : "–"}.` : ""}
    ${D.tasks ? `Task answers are graded automatically: numeric tasks take the last number in the output, text tasks look for the expected word near the start. A candidate is only recommended if it breaks at most ${pct(D.thresholds.max_regression, 0)} of the answers the original gets right.` : ""}
    Tiers${D.calibration ? " (calibrated on this model's answers)" : " (default thresholds)"}: near-lossless &lt; ${fmtKL(D.thresholds.near_lossless)}, excellent &lt; ${fmtKL(D.thresholds.excellent)}, noticeable &lt; ${fmtKL(D.thresholds.noticeable)} nats.
    <br><br>Generated by <code>kldrift</code> · reference <code>${esc(R.spec.path)}</code> on ${esc(R.info.device)}.
  </footer>`;

  $("#app").innerHTML = h;
  drawScatter(); drawCDF(); if ($("#cats")) drawCats(); if ($("#calib")) drawCalib();
  $("#doc").onchange = $("#cand").onchange = drawText; drawText();
  $("#wcand").onchange = drawWorst; drawWorst();
  if (D.tasks) { $("#tcand").onchange = $("#tfilter").onchange = drawTasks; drawTasks(); }
  $("#theme").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("kldrift-theme", root.dataset.theme); } catch (e) {}
  };
}

// ---------- charts ----------
function frame(w, hgt, m) { return { w, h: hgt, m, iw: w - m.l - m.r, ih: hgt - m.t - m.b }; }
function logTicks(lo, hi) {
  const t = []; for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) t.push(Math.pow(10, e));
  return t.filter(v => v >= lo * 0.999 && v <= hi * 1.001);
}

function drawScatter() {
  const C = DATA.candidates, f = frame(520, 300, { l: 54, r: 18, t: 14, b: 40 });
  const xs = [DATA.reference.info.size_bytes, ...C.map(c => c.model.info.size_bytes)];
  const ys = C.map(c => Math.max(c.summary.kl_mean, 1e-5));
  const xt = niceTicks(Math.max(...xs) * 1.05), x0 = 0, x1 = xt[xt.length - 1] < Math.max(...xs) * 1.05 ? Math.max(...xs) * 1.08 : xt[xt.length - 1];
  const y0 = Math.pow(10, Math.floor(Math.log10(Math.min(...ys)))), y1 = Math.pow(10, Math.ceil(Math.log10(Math.max(...ys) * 1.01)));
  const X = v => f.m.l + (v - x0) / (x1 - x0) * f.iw;
  const Y = v => f.m.t + f.ih - (Math.log10(v) - Math.log10(y0)) / (Math.log10(y1) - Math.log10(y0)) * f.ih;
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" width="100%">`;
  for (const t of logTicks(y0, y1)) s += `<line class="grid" x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${f.m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${t >= 1 ? t : t.toExponential(0)}</text>`;
  for (const v of xt) s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${f.m.t}" y2="${f.m.t + f.ih}"/><text x="${X(v)}" y="${f.h - 20}" text-anchor="middle">${v ? gb(v) : "0"}</text>`;
  s += `<text x="${f.m.l + f.iw / 2}" y="${f.h - 3}" text-anchor="middle">size on disk</text><text transform="translate(12 ${f.m.t + f.ih / 2}) rotate(-90)" text-anchor="middle">mean KL (log)</text>`;
  const rx = X(DATA.reference.info.size_bytes);
  s += `<line x1="${rx}" x2="${rx}" y1="${f.m.t}" y2="${f.m.t + f.ih}" stroke="${css("--muted")}" stroke-dasharray="4 4"/><text x="${rx - 4}" y="${f.m.t + 10}" text-anchor="end">${esc(DATA.reference.spec.name)}</text>`;
  const par = C.map((c, i) => ({ c, i })).filter(o => o.c.pareto).sort((a, b) => a.c.model.info.size_bytes - b.c.model.info.size_bytes);
  if (par.length > 1) s += `<polyline fill="none" stroke="${css("--accent")}" stroke-width="1.5" stroke-opacity="0.6" points="${par.map(o => X(o.c.model.info.size_bytes) + "," + Y(Math.max(o.c.summary.kl_mean, 1e-5))).join(" ")}"/>`;
  C.forEach((c, i) => {
    const cx = X(c.model.info.size_bytes), cy = Y(Math.max(c.summary.kl_mean, 1e-5));
    s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${color(i)}" stroke="${css("--panel")}" stroke-width="2"><title>${esc(c.model.spec.name)}: KL ${fmtKL(c.summary.kl_mean)}</title></circle><text class="lbl" x="${cx + 9}" y="${cy + 4}">${esc(c.model.spec.name)}</text>`;
  });
  $("#scatter").innerHTML = s + "</svg>";
}

function drawCDF() {
  const C = DATA.candidates, f = frame(520, 300, { l: 44, r: 18, t: 14, b: 40 });
  const series = C.map(c => {
    const v = []; for (const d of DATA.docs) { const dc = d.cands[c.model.spec.name]; if (dc) v.push(...dc.kl); }
    return v.map(x => Math.max(x, 1e-6)).sort((a, b) => a - b);
  });
  const all = series.flat(); if (!all.length) return;
  const lo = Math.max(1e-5, Math.pow(10, Math.floor(Math.log10(Math.max(all[Math.floor(all.length * 0.02)], 1e-5)))));
  const hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...all))));
  const X = v => f.m.l + (Math.log10(Math.min(Math.max(v, lo), hi)) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * f.iw;
  const Y = p => f.m.t + f.ih - p * f.ih;
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" width="100%">`;
  for (const p of [0, 0.25, 0.5, 0.75, 1]) s += `<line class="grid" x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${f.m.l - 8}" y="${Y(p) + 4}" text-anchor="end">${p * 100}%</text>`;
  for (const t of logTicks(lo, hi)) s += `<text x="${X(t)}" y="${f.h - 20}" text-anchor="middle">${t >= 1 ? t : t.toExponential(0)}</text>`;
  s += `<text x="${f.m.l + f.iw / 2}" y="${f.h - 3}" text-anchor="middle">per-token KL (log)</text>`;
  series.forEach((v, i) => {
    const n = v.length, step = Math.max(1, Math.floor(n / 300)), pts = [];
    for (let j = 0; j < n; j += step) pts.push(X(v[j]) + "," + Y((j + 1) / n));
    pts.push(X(v[n - 1]) + "," + Y(1));
    s += `<polyline fill="none" stroke="${color(i)}" stroke-width="2" points="${pts.join(" ")}"/>`;
  });
  s += C.map((c, i) => `<text class="lbl" x="${f.w - f.m.r}" y="${f.m.t + f.ih - 8 - i * 16}" text-anchor="end" style="fill:${color(i)}">${esc(c.model.spec.name)}</text>`).join("");
  $("#cdf").innerHTML = s + "</svg>";
}

function drawCats() {
  const C = DATA.candidates, cats = C[0].by_category.map(c => c.category);
  const bh = 12, gap = 3, groupH = C.length * (bh + gap) + 14, f = frame(1040, cats.length * groupH + 30, { l: 120, r: 70, t: 6, b: 24 });
  const max = Math.max(...C.flatMap(c => c.by_category.map(b => b.kl_mean)), 1e-9);
  const X = v => f.m.l + v / max * f.iw;
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" width="100%">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${f.m.t}" y2="${f.h - f.m.b}"/><text x="${X(v)}" y="${f.h - 6}" text-anchor="middle">${v.toFixed(3)}</text>`; }
  cats.forEach((cat, gi) => {
    const gy = f.m.t + gi * groupH;
    s += `<text class="lbl" x="${f.m.l - 12}" y="${gy + groupH / 2}" text-anchor="end">${esc(cat)}</text>`;
    C.forEach((c, i) => {
      const b = c.by_category.find(x => x.category === cat); if (!b) return;
      const y = gy + i * (bh + gap);
      s += `<rect x="${f.m.l}" y="${y}" width="${Math.max(1, X(b.kl_mean) - f.m.l)}" height="${bh}" rx="3" fill="${color(i)}"><title>${esc(c.model.spec.name)} · ${esc(cat)}: KL ${fmtKL(b.kl_mean)}, top-1 ${pct(b.top1_agreement)}</title></rect>
            <text x="${X(b.kl_mean) + 6}" y="${y + bh - 2}">${fmtKL(b.kl_mean)}</text>`;
    });
  });
  $("#cats").innerHTML = s + "</svg>";
}

function drawCalib() {
  const CAL = DATA.calibration, C = DATA.candidates, f = frame(1040, 330, { l: 56, r: 24, t: 18, b: 44 });
  const kls = CAL.points.map(p => p.kl).concat(CAL.kl_at, C.map(c => Math.max(c.summary.kl_mean, 1e-6)));
  const lo = Math.pow(10, Math.floor(Math.log10(Math.max(Math.min(...kls), 1e-6))));
  const hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...kls))));
  const X = v => f.m.l + (Math.log10(Math.max(v, lo)) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * f.iw;
  const Y = p => f.m.t + f.ih - p * f.ih;
  const P = kl => 1 / (1 + Math.exp(-(CAL.a + CAL.b * Math.log(Math.max(kl, 1e-6)))));
  const ci = Object.fromEntries(C.map((c, i) => [c.model.spec.name, i]));
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" width="100%">`;
  for (const p of [0, 0.25, 0.5, 0.75, 1]) s += `<line class="grid" x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${f.m.l - 8}" y="${Y(p) + 4}" text-anchor="end">${p * 100}%</text>`;
  for (const t of logTicks(lo, hi)) s += `<text x="${X(t)}" y="${f.h - 22}" text-anchor="middle">${t >= 1 ? t : t.toExponential(0)}</text>`;
  s += `<text x="${f.m.l + f.iw / 2}" y="${f.h - 4}" text-anchor="middle">KL on the original's answer (log)</text><text transform="translate(14 ${f.m.t + f.ih / 2}) rotate(-90)" text-anchor="middle">P(answer changes)</text>`;
  // tier bands
  const bands = [[lo, CAL.kl_at[0], "--good", "near-lossless"], [CAL.kl_at[0], CAL.kl_at[1], "--good", "excellent"], [CAL.kl_at[1], CAL.kl_at[2], "--warn", "noticeable"], [CAL.kl_at[2], hi, "--bad", "degraded"]];
  bands.forEach(([a, b, col, label], i) => {
    const xa = X(a), xb = X(b); if (xb - xa < 1) return;
    s += `<rect x="${xa}" y="${f.m.t}" width="${xb - xa}" height="${f.ih}" fill="var(${col})" opacity="${i === 0 ? 0.10 : i === 1 ? 0.05 : 0.06}"/>`;
    if (xb - xa > 60) s += `<text x="${(xa + xb) / 2}" y="${f.m.t + 14}" text-anchor="middle" style="fill:var(${col})">${label}</text>`;
  });
  CAL.kl_at.forEach((k, i) => s += `<line x1="${X(k)}" x2="${X(k)}" y1="${f.m.t}" y2="${f.m.t + f.ih}" stroke="${css("--muted")}" stroke-dasharray="3 4"/><text x="${X(k) + 4}" y="${f.m.t + f.ih - 6}">${pct(CAL.levels[i], 0)}</text>`);
  // points (deterministic jitter)
  CAL.points.forEach((p, j) => {
    const jit = ((j * 9301 + 49297) % 233280) / 233280 * 0.06 - 0.03;
    const y = p.changed ? 0.96 + jit : 0.04 + jit;
    s += `<circle cx="${X(p.kl)}" cy="${Y(y)}" r="3.2" fill="${color(ci[p.candidate] ?? 0)}" opacity="0.75"><title>${esc(p.candidate)} · ${esc(DATA.tasks.items[p.task].id)}: KL ${fmtKL(p.kl)}, ${p.changed ? "changed" : "unchanged"}</title></circle>`;
  });
  // fitted curve
  const pts = []; for (let i = 0; i <= 200; i++) { const kl = Math.pow(10, Math.log10(lo) + (Math.log10(hi) - Math.log10(lo)) * i / 200); pts.push(X(kl) + "," + Y(P(kl))); }
  s += `<polyline fill="none" stroke="${css("--ink")}" stroke-width="2" points="${pts.join(" ")}"/>`;
  // where each candidate sits (prompt KL)
  C.forEach((c, i) => {
    const kl = Math.max(c.summary.kl_mean, 1e-6), x = X(kl), y = Y(P(kl));
    s += `<circle cx="${x}" cy="${y}" r="7" fill="${color(i)}" stroke="${css("--panel")}" stroke-width="2"><title>${esc(c.model.spec.name)}: mean KL ${fmtKL(kl)} → ~${pct(P(kl), 0)} of answers change</title></circle>
          <text class="lbl" x="${x + 10}" y="${y - 8}">${esc(c.model.spec.name)} ~${pct(P(kl), 0)}</text>`;
  });
  $("#calib").innerHTML = s + "</svg>";
}

// ---------- token explorer ----------
let current = null;
function drawText() {
  const d = DATA.docs[+$("#doc").value], c = DATA.candidates[+$("#cand").value], dc = d.cands[c.model.spec.name];
  current = { d, c, dc };
  const scale = Math.max(0.5, c.summary.kl_p99 || 0.5);
  let h = `<span class="tok">${esc(d.pieces[0] || "")}</span>`;
  for (let i = 1; i < d.pieces.length; i++) {
    const kl = dc ? dc.kl[i - 1] : 0, fl = dc ? dc.flip[i - 1] : 0;
    const a = Math.min(0.9, Math.sqrt(Math.min(kl / scale, 1)) * 0.9);
    const p = d.pieces[i];
    const body = p.includes("\n") ? esc(p).replace(/\n/g, '<span class="nl">↵</span>\n') : esc(p);
    h += `<span class="tok f${fl}" data-i="${i}" style="background:rgba(${css("--heat")},${a.toFixed(3)})">${body}</span>`;
  }
  $("#text").innerHTML = h;
}

function altList(list, actual) {
  return list.map(([w, p]) => `<div class="alt"><span class="w${w === actual ? " hit" : ""}">${esc(showPiece(w))}</span><span class="p">${(p * 100).toFixed(1)}%</span><div class="pbar" style="width:${Math.max(1, p * 100)}%"></div></div>`).join("");
}

document.addEventListener("mousemove", e => {
  const tip = $("#tip"), t = e.target.closest && e.target.closest(".tok[data-i]");
  if (!t || !current) { tip.style.display = "none"; return; }
  const i = +t.dataset.i, { d, c, dc } = current, actual = d.pieces[i];
  const fl = dc.flip[i - 1];
  tip.innerHTML = `<div><b class="mono">${esc(showPiece(actual))}</b> <span class="muted">· KL ${fmtKL(dc.kl[i - 1])}${fl === 2 ? ' · <b style="color:var(--bad)">confident flip</b>' : fl === 1 ? " · top token differs" : ""}</span></div>
    <div class="tipgrid"><div><div class="muted">${esc(DATA.reference.spec.name)} predicted</div>${altList(d.ref_top[i - 1], actual)}</div>
    <div><div class="muted">${esc(c.model.spec.name)} predicted</div>${altList(dc.top[i - 1], actual)}</div></div>`;
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 12) + "px";
  tip.style.top = (e.clientY + 18 + r.height > innerHeight ? e.clientY - r.height - 12 : e.clientY + 18) + "px";
});

function drawTasks() {
  const T = DATA.tasks, c = DATA.candidates[+$("#tcand").value], name = c.model.spec.name;
  const ref = T.runs[DATA.reference.spec.name], runs = T.runs[name], mode = $("#tfilter").value;
  const idx = T.items.map((_, i) => i).filter(i =>
    mode === "all" ? true : mode === "diff" ? runs[i].diverge_at != null : runs[i].correct !== ref[i].correct);
  $("#tcount").textContent = `${idx.length} of ${T.items.length} tasks`;
  const mark = ok => ok ? '<span style="color:var(--good)">✓ correct</span>' : '<span style="color:var(--bad)">✗ wrong</span>';
  const out = (text, cut) => {
    const chars = [...text], a = chars.slice(0, cut).join(""), b = chars.slice(cut).join("");
    return `<div class="ctx">${esc(a)}${b ? `<mark>${esc(b)}</mark>` : ""}</div>`;
  };
  $("#tasklist").innerHTML = idx.length ? idx.map(i => {
    const t = T.items[i], r = ref[i], q = runs[i];
    const tag = q.correct !== r.correct ? (r.correct ? '<span class="tier t-degraded">broken</span>' : '<span class="tier t-near_lossless">fixed</span>')
      : q.diverge_at == null ? '<span class="tier t-reference">identical</span>' : '<span class="tier t-reference">reworded</span>';
    return `<div class="wcard" style="margin-top:12px"><div class="row"><span><b>${esc(t.id)}</b> <span class="muted">· ${esc(t.category)}</span></span>${tag}</div>
      <div style="margin:4px 0 10px">${esc(t.prompt)} <span class="muted">→ expected <b class="mono">${esc(t.answer)}</b></span></div>
      <div class="tipgrid"><div><div class="muted">${esc(DATA.reference.spec.name)} · ${mark(r.correct)}</div>${out(r.text, Infinity)}</div>
      <div><div class="muted">${esc(name)} · ${mark(q.correct)}${q.diverge_at != null ? ` · differs from token ${q.diverge_at}` : ""}</div>${out(q.text, q.same_prefix_chars)}</div></div></div>`;
  }).join("") : '<p class="muted">Nothing here: this quant gives the same verdict as the original on every task.</p>';
}

function drawWorst() {
  const c = DATA.candidates[+$("#wcand").value];
  $("#worst").innerHTML = c.worst.map(w => {
    const d = DATA.docs[w.doc];
    return `<div class="wcard"><div class="row"><span class="muted">${esc(d.category)} / ${esc(d.name)}</span><span class="mono" style="color:var(--bad)">KL ${w.kl.toFixed(3)}</span></div>
      <div class="ctx">…${esc(w.context)}<mark>${esc(w.actual)}</mark></div>
      <div class="tipgrid"><div><div class="muted">${esc(DATA.reference.spec.name)}</div>${altList(w.ref_top, w.actual)}</div>
      <div><div class="muted">${esc(c.model.spec.name)}</div>${altList(w.cand_top, w.actual)}</div></div></div>`;
  }).join("");
}

try { const t = localStorage.getItem("kldrift-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
if (DATA) render(); else $("#app").innerHTML = "<p>No data embedded.</p>";
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => DATA && (drawScatter(), drawCDF()));
</script>
</body>
</html>
