<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #171717;
  --line: #242424;
  --ink: #f2f2f0;
  --ink-2: #c9c9c5;
  --muted: #85857f;
  /* quality scale: identical -> barely -> noticeably -> badly */
  --q0: #f2f2f0;
  --q1: #8ec5ff;
  --q2: #d9a441;
  --q3: #e5484d;
  --heat: 229, 72, 77;
  --accent: #8ec5ff;
  --bar: #4a4a47;
  --s0: #f2f2f0; --s1: #9b9bff; --s2: #4fd1c5; --s3: #f0a6ca; --s4: #bef264; --s5: #93c5fd;
  --sans: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
b, strong { font-weight: 500; color: var(--ink); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 600px) { .wrap { padding: 0 16px; } }

/* ---------- hero ---------- */
.hero { position: relative; min-height: min(88vh, 760px); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.hero .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 68%; background: var(--hero) 38% 62% / cover no-repeat; }
/* fade the photo's left edge into the black page so the text sits on black */
.hero .photo::before { content: ""; position: absolute; inset: 0; background:
  linear-gradient(90deg, var(--bg) 0%, rgba(10,10,10,0.85) 16%, rgba(10,10,10,0) 48%),
  linear-gradient(0deg, var(--bg) 0%, rgba(10,10,10,0) 32%); }
.hero > .wrap { position: relative; z-index: 1; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
.brand { font-family: var(--mono); font-weight: 500; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.brand .mark { display: block; }
.brand span { color: var(--muted); font-weight: 400; }
.lang { display: flex; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; overflow: hidden; }
.lang button { background: none; border: 0; color: var(--muted); font: 500 13px var(--sans); padding: 6px 12px; cursor: pointer; transition: background-color 160ms cubic-bezier(0.22, 1, 0.36, 1), color 160ms cubic-bezier(0.22, 1, 0.36, 1); }
.lang button:hover { color: var(--ink); }
.lang button.on { background: var(--ink); color: #000; }
.hero-text { padding: 96px 0 64px; max-width: 480px; text-shadow: 0 1px 24px rgba(0,0,0,0.8); }
.kicker { color: var(--ink-2); font-size: 18px; margin: 0 0 12px; }
.hero h1 { font-size: clamp(44px, 6.4vw, 80px); line-height: 1; letter-spacing: -0.03em; margin: 0 0 24px; font-weight: 500; }
.hero h1 .pick { font-family: var(--mono); letter-spacing: -0.04em; color: var(--accent); }
.hero p.lead { font-size: 19px; color: var(--ink-2); margin: 0 0 10px; max-width: 540px; }
.hero .meta { font-size: 13px; color: var(--muted); margin-top: 24px; }
@media (max-width: 760px) {
  .hero { min-height: 0; }
  .hero .photo { position: relative; width: 100%; height: 64vw; order: 1; background-position: 45% 60%; }
  .hero .photo::before { background: linear-gradient(0deg, #000 0%, rgba(0,0,0,0) 30%); }
  .hero > .wrap { order: 2; }
  .hero .topbar { position: absolute; top: calc(-64vw); left: 16px; right: 16px; }
  .hero-text { padding: 8px 0 48px; max-width: none; }
  .hero p.lead { font-size: 17px; }
}

/* ---------- sections ---------- */
section { padding: 88px 0 0; }
section > .wrap > h2 { font-size: clamp(28px, 3.6vw, 36px); letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 12px; font-weight: 500; }
section > .wrap > p.intro { color: var(--ink-2); font-size: 17px; max-width: 680px; margin: 0 0 32px; }
@media (max-width: 600px) { section { padding-top: 64px; } }

/* how it works */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.step { background: var(--bg); padding: 24px; }
.step .n { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.step h3 { margin: 8px 0; font-size: 18px; font-weight: 500; }
.step p { margin: 0; color: var(--ink-2); font-size: 15px; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }

/* options */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(236px, 1fr)); gap: 16px; }
.opt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; position: relative; }
.opt.rec { border-color: rgba(142,197,255,0.55); }
.opt .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.opt .name { font-family: var(--mono); font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
.opt .tag { font-size: 12px; font-weight: 500; color: #06121f; background: var(--accent); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.opt .tag.ref { background: none; color: var(--muted); border: 1px solid var(--line); }
.opt .size { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
/* signature: the drift line. Where a version sits between "identical" and "badly damaged" */
.drift { position: relative; height: 28px; margin: 16px 0 20px; }
.drift .track { position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: rgba(242,242,240,0.16); }
.drift .tick { position: absolute; top: 4px; width: 1px; height: 9px; background: rgba(242,242,240,0.28); }
.drift .trail { position: absolute; left: 0; top: 7px; height: 3px; border-radius: 2px; }
.drift .dot { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--surface); }
.drift .ends { position: absolute; left: 0; right: 0; top: 16px; display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
.opt .verdict { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
.opt ul { list-style: none; margin: 0; padding: 0; }
.opt li { color: var(--ink-2); font-size: 15px; padding: 8px 0; border-top: 1px solid var(--line); }
.opt li b { color: var(--ink); font-weight: 500; }

/* bars */
.bars { display: grid; gap: 24px; }
.bargroup .label { font-weight: 500; margin-bottom: 8px; }
.bar { display: grid; grid-template-columns: 112px 1fr 72px; align-items: center; gap: 12px; font-size: 14px; margin: 4px 0; color: var(--ink-2); }
.bar .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; background: var(--bar); }
.bar.pick { color: var(--ink); }
.bar.pick .fill { background: var(--accent); }
.bar .v { text-align: right; }
@media (max-width: 560px) { .bar { grid-template-columns: 80px 1fr 56px; } }
.callout { border-left: 2px solid var(--q2); padding: 4px 0 4px 16px; color: var(--ink-2); margin: 0 0 28px; max-width: 680px; }
.callout b { color: var(--ink); }

/* explorer */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: 15px var(--sans); max-width: 100%; transition: border-color 160ms cubic-bezier(0.22, 1, 0.36, 1); }
select:hover { border-color: #3a3a3a; }
select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.ramp { display: inline-block; width: 88px; height: 8px; border-radius: 4px; vertical-align: middle; background: linear-gradient(90deg, rgba(var(--heat),0.05), rgba(var(--heat),0.9)); }
.u { box-shadow: inset 0 -2px 0 var(--q3); }
.text { font-family: var(--mono); font-size: 14px; line-height: 2; white-space: pre-wrap; word-break: break-word; max-height: 460px; overflow-y: auto; padding-right: 6px; color: var(--ink-2); }
.tok { border-radius: 3px; cursor: pointer; color: var(--ink); }
.tok:empty { display: inline-block; min-width: 3px; height: 1.1em; vertical-align: -2px; }
.tok.f2 { box-shadow: inset 0 -2px 0 var(--q3); }
.tok.f1 { box-shadow: inset 0 -2px 0 rgba(245,165,36,0.7); }
.tok:hover, .tok.sel { outline: 1.5px solid var(--ink); }
.nl { color: var(--muted); opacity: 0.5; }

#tip { position: fixed; z-index: 20; pointer-events: none; display: none; width: 380px; max-width: calc(100vw - 24px); background: #0d0d0d; border: 1px solid #333; border-radius: 12px; padding: 16px; font-size: 13px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
#tip .t { font-weight: 500; margin-bottom: 8px; }
#tip.term { width: 300px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.alt { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 4px 0; font-family: var(--mono); align-items: center; }
.alt .w { white-space: pre; overflow: hidden; text-overflow: ellipsis; background: var(--surface-2); padding: 0 5px; border-radius: 3px; }
.alt .w.hit { outline: 1px solid var(--ink-2); }
.alt .p { color: var(--muted); font-size: 12px; }
.alt .pb { grid-column: 1 / -1; height: 2px; background: var(--ink-2); opacity: 0.5; margin-top: -2px; }

/* tasks */
.tsum { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 24px; }
.tcell { border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.tcell .big { font-family: var(--mono); font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin: 4px 0; }
.tcell .sub { color: var(--ink-2); font-size: 14px; }
.stack { display: flex; height: 8px; border-radius: 3px; overflow: hidden; margin-top: 12px; background: var(--surface-2); }
.qa { border-top: 1px solid var(--line); padding: 20px 0; }
.qa .q { font-weight: 500; margin-bottom: 4px; }
.qa .exp { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.qa .ans { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.qa .ans mark { background: rgba(var(--heat), 0.28); color: var(--ink); border-radius: 2px; }
.qa .who { font-size: 13px; margin-bottom: 6px; color: var(--muted); }
.ok { color: var(--q1); } .bad { color: var(--q3); }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }

/* luck */
.claims { display: grid; gap: 10px; }
.claim { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: start; border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.chip { font-size: 12px; font-weight: 500; border-radius: 6px; padding: 4px 8px; text-align: center; }
.chip.sure { background: var(--ink); color: #0a0a0a; }
.chip.maybe { border: 1px solid var(--line); color: var(--muted); }
@media (max-width: 560px) { .claim { grid-template-columns: 1fr; gap: 8px; } .chip { justify-self: start; } }
.stab { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin-top: 12px; }
.stab div { display: flex; align-items: center; justify-content: center; font: 500 13px var(--sans); color: var(--ink-2); background: #2a2a28; white-space: nowrap; overflow: hidden; }
.stab div.pick { background: var(--accent); color: #06121f; }

/* nerds */
details.nerd { margin-top: 88px; border-top: 1px solid var(--line); }
details.nerd > summary { list-style: none; cursor: pointer; padding: 28px 0; font-size: 22px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
details.nerd > summary::-webkit-details-marker { display: none; }
details.nerd > summary::after { content: "+"; font-family: var(--mono); color: var(--muted); font-size: 26px; font-weight: 400; }
details.nerd[open] > summary::after { content: "−"; }
.nerd h3 { font-size: 18px; font-weight: 500; margin: 40px 0 8px; }
.nerd .note { color: var(--muted); font-size: 14px; margin: 0 0 14px; max-width: 720px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 10px 10px; white-space: nowrap; }
td { text-align: right; padding: 10px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
svg text { fill: var(--muted); font: 11px var(--sans); }
svg .lbl { fill: var(--ink); font-weight: 600; }
svg .grid { stroke: var(--line); stroke-dasharray: 2 4; }
.method { color: var(--ink-2); font-size: 14px; max-width: 760px; }
.method code { font-family: var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

.term { border-bottom: 1px dotted var(--muted); cursor: help; }
.end { height: 96px; }
</style>

let lang = "en";
try { lang = localStorage.getItem("bitrot-lang") || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en"); } catch (e) {}
const T = (k, v = {}) => String(STR[lang][k] ?? STR.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const term = k => `<span class="term" data-term="${k}">${STR[lang].terms[k][0]}</span>`;
const cat = c => STR[lang].cats[c] || c;

// ---------------------------------------------------------------- helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const series = i => `var(--s${i % 6})`;
const QCOL = { near_lossless: "var(--q0)", excellent: "var(--q1)", noticeable: "var(--q2)", degraded: "var(--q3)" };
const gb = b => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB";
const pct = (x, d = 1) => (x * 100).toFixed(d).replace(/\.0$/, "") + "%";
const fmtKL = x => x < 0.001 ? x.toExponential(1) : x.toFixed(4);
const num = n => n.toLocaleString(lang === "ru" ? "ru-RU" : "en-US");
const showPiece = s => s.replace(/\n/g, "↵").replace(/\t/g, "⇥") || "·";
const nice = n => n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2);

// Log-scale position of a KL value on the drift line, 0..100.
function driftScale(D) {
  const th = D.thresholds, kls = D.candidates.map(c => Math.max(c.summary.kl_mean, 1e-6));
  const lo = Math.min(th.near_lossless / 4, ...kls) , hi = Math.max(th.noticeable * 4, ...kls.map(k => k * 1.6));
  return kl => Math.max(0, Math.min(100, (Math.log(Math.max(kl, lo)) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) * 100));
}
function driftLine(D, kl, col) {
  const x = driftScale(D), th = D.thresholds;
  const ticks = [th.near_lossless, th.excellent, th.noticeable].map(t => `<span class="tick" style="left:${x(t)}%"></span>`).join("");
  const pos = kl == null ? 0 : x(kl);
  return `<div class="drift"><span class="track"></span>${ticks}<span class="trail" style="width:${pos}%;background:${col};opacity:.35"></span>
    <span class="dot" style="left:${pos}%;background:${col}"></span><div class="ends"><span>${T("drift_lo")}</span><span>${T("drift_hi")}</span></div></div>`;
}

function modelName(D) {
  const base = (D.reference.spec.path.split(/[\\/]/).pop() || D.reference.spec.name).replace(/\.gguf$/i, "");
  const tag = D.reference.spec.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return base.replace(new RegExp("[-_.]?" + tag + "$", "i"), "") || base;
}

// ---------------------------------------------------------------- render
function render() {
  const D = DATA, R = D.reference, C = D.candidates, TK = D.tasks, ST = D.stats;
  document.documentElement.lang = lang;
  const ref = R.info.size_bytes || 1;
  const rec = D.recommendation && C.find(c => c.model.spec.name === D.recommendation.name);
  const stab = ST && rec ? (ST.stability.find(x => x[0] === rec.model.spec.name) || [0, 0])[1] : null;
  const tsum = n => TK && TK.summary[n];
  const refT = TK && TK.summary[R.spec.name];
  const model = modelName(D);
  const tokens = C[0] ? C[0].summary.n_tokens : 0;

  let h = `<header class="hero" style="--hero:url('${HERO}')"><div class="photo"></div><div class="wrap" style="width:100%">
    <div class="topbar"><div class="brand"><svg class="mark" viewBox="0 0 48 48" width="24" height="24" aria-hidden="true"><g fill="var(--ink)"><rect x="3" y="6" width="10" height="10" rx="1.5"/><rect x="16" y="6" width="10" height="10" rx="1.5"/><rect x="29" y="6" width="10" height="10" rx="1.5"/><rect x="3" y="19" width="10" height="10" rx="1.5"/><rect x="16" y="19" width="10" height="10" rx="1.5"/><rect x="29" y="23" width="6" height="6" rx="1"/><rect x="3" y="32" width="10" height="10" rx="1.5"/><rect x="16" y="35" width="7" height="7" rx="1"/></g><g fill="var(--accent)"><rect x="30" y="37" width="4" height="4" rx="0.8"/><rect x="38" y="30" width="3" height="3" rx="0.6"/><rect x="43" y="38" width="2" height="2" rx="0.4"/></g></svg>bitrot <span>v${esc(D.version)}</span></div>
      <div class="lang"><button data-l="en" class="${lang === "en" ? "on" : ""}">EN</button><button data-l="ru" class="${lang === "ru" ? "on" : ""}">RU</button></div></div>
    <div class="hero-text">
      <p class="kicker">${T("kicker", { model: esc(model) })}</p>`;
  if (rec) {
    h += `<h1>${T("download")} <span class="pick">${esc(rec.model.spec.name)}</span></h1>
      <p class="lead">${T("lead_pick", { size: pct(rec.model.info.size_bytes / ref, 0), top1: pct(rec.summary.top1_agreement) })}</p>
      ${stab != null ? `<p class="lead">${T(stab >= 0.8 ? "lead_stable" : "lead_close", { s: pct(stab, 0) })}</p>` : ""}`;
  }
  h += `<p class="meta">${T("meta", { tokens: num(tokens), tasks: TK ? T("meta_tasks", { n: TK.items.length }) : "", chip: esc(D.machine.chip || D.machine.arch), date: esc(D.created) })}</p>
    </div></div></header>`;

  // how it works
  h += `<section><div class="wrap"><h2>${T("how_title")}</h2><p class="intro">${T("how_intro", { quant: term("quant") })}</p>
    <div class="steps">
      <div class="step"><div class="n">01</div><h3>${T("s1t")}</h3><p>${T("s1")}</p></div>
      <div class="step"><div class="n">02</div><h3>${T("s2t")}</h3><p>${T("s2", { token: term("token") })}</p></div>
      <div class="step"><div class="n">03</div><h3>${TK ? T("s3t") : T("s3t_no")}</h3><p>${TK ? T("s3") : T("s3_no")}</p></div>
    </div></div></section>`;

  // options
  const speed = m => m.bench ? m.bench.decode_tok_s : null;
  const refSpeed = speed(R);
  h += `<section><div class="wrap"><h2>${T("opts_title")}</h2><p class="intro">${T("opts_intro")}</p><div class="opts">`;
  h += `<div class="opt"><div class="head"><span class="name">${esc(R.spec.name)}</span><span class="tag ref">${T("original")}</span></div>
    <div class="size">${T("of_orig", { size: gb(R.info.size_bytes), pct: "100%" })}</div>${driftLine(D, null, "var(--q0)")}
    <div class="verdict">${T("q_ref")}</div><ul><li>${T("ref_line1")}</li>
    ${refT ? `<li>${T("ref_line2", { c: refT.correct, n: refT.n })}</li>` : ""}
    ${refSpeed ? `<li>${T("speed", { x: nice(refSpeed), tokens: term("token"), rel: "" })}</li>` : ""}</ul></div>`;
  const pc = c => D.calibration ? 1 / (1 + Math.exp(-(D.calibration.a + D.calibration.b * Math.log(Math.max(c.summary.kl_mean, 1e-6))))) : null;
  [...C].sort((a, b) => b.model.info.size_bytes - a.model.info.size_bytes).forEach(c => {
    const s = c.summary, t = tsum(c.model.spec.name), sp = speed(c.model), p = pc(c);
    let rel = "";
    if (sp && refSpeed) { const r = sp / refSpeed; rel = r >= 1.05 ? T("faster", { r: r.toFixed(1) }) : r <= 0.95 ? T("slower", { r: (1 / r).toFixed(1) }) : ""; }
    h += `<div class="opt ${rec === c ? "rec" : ""}"><div class="head"><span class="name">${esc(c.model.spec.name)}</span>${rec === c ? `<span class="tag">${T("pick")}</span>` : ""}</div>
      <div class="size">${T("of_orig", { size: gb(c.model.info.size_bytes), pct: pct(c.model.info.size_bytes / ref, 0) })}</div>
      ${driftLine(D, c.summary.kl_mean, QCOL[c.tier])}
      <div class="verdict" style="color:${QCOL[c.tier]}">${T("q_" + c.tier)}</div><ul>
      <li>${T("same_word", { p: pct(s.top1_agreement) })}</li>
      ${t ? `<li>${T("tasks_line", { c: t.correct, n: t.n, rc: refT.correct })} ${t.regressions ? T("broke", { b: t.regressions }) : T("broke0")}</li>` : ""}
      ${p != null ? `<li>${T("p_change", { p: pct(p, 0) })}</li>` : ""}
      ${sp ? `<li>${T("speed", { x: nice(sp), tokens: term("token"), rel })}</li>` : ""}
      ${c.model.bench && c.model.bench.energy_mj_per_tok != null ? `<li>${T("energy", { e: c.model.bench.energy_mj_per_tok.toFixed(1) })}</li>` : ""}
      </ul></div>`;
  });
  h += `</div></div></section>`;

  // where it breaks
  if (C[0] && C[0].by_category.length > 1) {
    const cats = C[0].by_category.map(b => b.category);
    const worst = C.map(c => c.by_category.reduce((a, b) => b.kl_mean > a.kl_mean ? b : a).category);
    const allSame = worst.every(w => w === worst[0]);
    const max = Math.max(...C.flatMap(c => c.by_category.map(b => b.kl_mean)), 1e-9);
    h += `<section><div class="wrap"><h2>${T("where_title")}</h2><p class="intro">${T("where_intro")}</p>
      <p class="callout">${allSame ? T("where_call", { cat: esc(cat(worst[0])) }) : T("where_call_mixed")}</p><div class="bars">`;
    cats.sort((a, b) => {
      const m = x => C.reduce((s, c) => s + (c.by_category.find(y => y.category === x) || { kl_mean: 0 }).kl_mean, 0);
      return m(b) - m(a);
    }).forEach(k => {
      h += `<div class="bargroup"><div class="label">${esc(cat(k))}</div>`;
      C.forEach((c, i) => {
        const b = c.by_category.find(x => x.category === k); if (!b) return;
        h += `<div class="bar ${rec === c ? "pick" : ""}"><span class="mono">${esc(c.model.spec.name)}</span><div class="track"><div class="fill" style="width:${Math.max(0.5, b.kl_mean / max * 100)}%"></div></div><span class="v mono">${fmtKL(b.kl_mean)}</span></div>`;
      });
      h += `</div>`;
    });
    h += `</div></div></section>`;
  }

  // see it
  const defCand = Math.max(0, C.length - 1);
  h += `<section><div class="wrap"><h2>${T("see_title")}</h2><p class="intro" id="seeintro"></p><div class="panel">
    <div class="controls">
      <select id="doc">${D.docs.map((d, i) => `<option value="${i}">${esc(cat(d.category))} · ${esc(d.name)}</option>`).join("")}</select>
      <select id="cand">${C.map((c, i) => `<option value="${i}" ${i === defCand ? "selected" : ""}>${esc(c.model.spec.name)}</option>`).join("")}</select>
      <div class="legend"><span><span class="ramp"></span> ${T("legend_shade")}</span><span class="u">${T("legend_line")}</span></div>
    </div><div class="text" id="text"></div></div></div></section>`;

  // tasks
  if (TK) {
    h += `<section><div class="wrap"><h2>${T("tasks_title")}</h2><p class="intro">${T("tasks_intro", { n: TK.items.length })}</p><div class="tsum">`;
    C.forEach((c, i) => {
      const s = TK.summary[c.model.spec.name]; if (!s) return;
      const other = s.n - s.identical - s.regressions - s.fixes;
      const seg = (n, col, label) => n ? `<div title="${label}: ${n}" style="width:${n / s.n * 100}%;background:${col}"></div>` : "";
      h += `<div class="tcell"><div class="mono" style="color:${rec === c ? "var(--accent)" : "var(--ink-2)"}">${esc(c.model.spec.name)}</div>
        <div class="big">${T("correct_of", { c: s.correct, n: s.n })}</div>
        <div class="sub">${s.regressions ? T("broke", { b: s.regressions }) : T("broke0")}</div>
        <div class="sub">${T("same_text", { p: pct(s.identical / s.n, 0) })}</div>
        <div class="stack">${seg(s.identical, "var(--q0)", T("stack_same"))}${seg(other, "#3a3a3a", T("stack_reworded"))}${seg(s.fixes, "var(--q1)", T("stack_fixed"))}${seg(s.regressions, "var(--q3)", T("stack_broken"))}</div></div>`;
    });
    h += `</div><div class="controls">
      <select id="tcand">${C.map((c, i) => `<option value="${i}" ${i === defCand ? "selected" : ""}>${esc(c.model.spec.name)}</option>`).join("")}</select>
      <select id="tfilter"><option value="changed">${T("filter_changed")}</option><option value="diff">${T("filter_diff")}</option><option value="all">${T("filter_all")}</option></select>
      <span class="muted" id="tcount" style="font-size:14px"></span></div><div id="tasklist"></div></div></section>`;
  }

  // luck
  if (ST) {
    h += `<section><div class="wrap"><h2>${T("luck_title")}</h2><p class="intro">${T("luck_intro")}</p><div class="claims">`;
    const sig = i => i && (i.lo > 0 || i.hi < 0);
    ST.pairs.forEach(p => {
      const k = sig(p.kl_diff), a = p.acc_diff, as = sig(a);
      let text, sure;
      if (!k) { text = T("c_same", { s: esc(p.smaller), l: esc(p.larger) }); sure = false; }
      else if (a && as && a.est < 0) { text = T("c_worse", { s: esc(p.smaller), l: esc(p.larger) }); sure = true; }
      else if (a && as && a.est > 0) { text = T("c_better", { s: esc(p.smaller), l: esc(p.larger) }); sure = true; }
      else if (a) { text = T("c_drift_only", { s: esc(p.smaller), l: esc(p.larger), n: TK.items.length }); sure = false; }
      else { text = T("c_drift", { s: esc(p.smaller), l: esc(p.larger) }); sure = true; }
      h += `<div class="claim"><span class="chip ${sure ? "sure" : "maybe"}">${T(sure ? "sure" : "maybe")}</span><div>${text}</div></div>`;
    });
    h += `</div><p style="margin:28px 0 0;color:var(--ink-2)">${T("stab_title")}</p><div class="stab">${ST.stability.map(([n, f]) => {
      const i = C.findIndex(c => c.model.spec.name === n);
      return `<div class="${rec && n === rec.model.spec.name ? "pick" : ""}" title="${esc(n)}: ${pct(f)}" style="width:${f * 100}%">${f > 0.1 ? `${esc(n)} · ${pct(f, 0)}` : ""}</div>`;
    }).join("")}</div></div></section>`;
  }

  // nerds
  h += `<div class="wrap"><details class="nerd"><summary>${T("nerd")}</summary>${nerdHTML()}</details></div>`;
  h += `<div class="end"></div>`;

  $("#app").innerHTML = h;
  $("#seeintro").innerHTML = T("see_intro", { cand: `<b class="mono">${esc(C[defCand] ? C[defCand].model.spec.name : "")}</b>` });
  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem("bitrot-lang", lang); } catch (e) {} render(); });
  $("#doc").onchange = $("#cand").onchange = drawText; drawText();
  if (TK) { $("#tcand").onchange = $("#tfilter").onchange = drawTasks; drawTasks(); }
  const nd = $("details.nerd");
  nd.addEventListener("toggle", () => { if (nd.open) drawNerdCharts(); });
}

// ---------------------------------------------------------------- explorer
let current = null;
function drawText() {
  const D = DATA, d = D.docs[+$("#doc").value], c = D.candidates[+$("#cand").value], dc = d.cands[c.model.spec.name];
  current = { d, c, dc };
  $("#seeintro").innerHTML = T("see_intro", { cand: `<b class="mono">${esc(c.model.spec.name)}</b>` });
  const scale = Math.max(0.5, c.summary.kl_p99 || 0.5);
  let h = `<span class="tok">${esc(d.pieces[0] || "")}</span>`;
  for (let i = 1; i < d.pieces.length; i++) {
    const kl = dc ? dc.kl[i - 1] : 0, fl = dc ? dc.flip[i - 1] : 0;
    const a = Math.min(0.85, Math.sqrt(Math.min(kl / scale, 1)) * 0.85);
    const p = d.pieces[i];
    const body = p.includes("\n") ? esc(p).replace(/\n/g, '<span class="nl">↵</span>\n') : esc(p);
    h += `<span class="tok f${fl}" data-i="${i}" style="background:rgba(${css("--heat")},${a.toFixed(3)})">${body}</span>`;
  }
  $("#text").innerHTML = h;
}

function alts(list, actual) {
  return list.map(([w, p]) => `<div class="alt"><span class="w${w === actual ? " hit" : ""}">${esc(showPiece(w))}</span><span class="p">${(p * 100).toFixed(1)}%</span><div class="pb" style="width:${Math.max(1, p * 100)}%"></div></div>`).join("");
}

function tokenTip(el) {
  const i = +el.dataset.i, { d, c, dc } = current, actual = d.pieces[i], fl = dc.flip[i - 1];
  return `<div class="t mono">${esc(showPiece(actual))} <span class="muted" style="font-family:var(--sans);font-weight:400">· KL ${fmtKL(dc.kl[i - 1])}${fl === 2 ? ` · <span class="bad">${T("tip_flip2")}</span>` : fl === 1 ? ` · ${T("tip_flip")}` : ""}</span></div>
    <div class="cols"><div><div class="muted">${T("tip_ref")}</div>${alts(d.ref_top[i - 1], actual)}</div>
    <div><div class="muted">${T("tip_cand", { cand: esc(c.model.spec.name) })}</div>${alts(dc.top[i - 1], actual)}</div></div>`;
}

const tip = () => $("#tip");
function showTip(html, x, y, cls = "") {
  const el = tip(); el.className = cls; el.innerHTML = html; el.style.display = "block";
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(12, Math.min(x + 14, innerWidth - r.width - 12)) + "px";
  el.style.top = (y + 18 + r.height > innerHeight ? Math.max(12, y - r.height - 12) : y + 18) + "px";
}
document.addEventListener("mousemove", e => {
  const tk = e.target.closest && e.target.closest(".tok[data-i]");
  const tm = e.target.closest && e.target.closest(".term");
  if (tk && current) return showTip(tokenTip(tk), e.clientX, e.clientY);
  if (tm) { const [n, d] = STR[lang].terms[tm.dataset.term]; return showTip(`<div class="t">${n}</div><div style="color:var(--ink-2)">${d}</div>`, e.clientX, e.clientY, "term"); }
  if (!document.querySelector(".tok.sel")) tip().style.display = "none";
});
document.addEventListener("click", e => {
  const tk = e.target.closest && e.target.closest(".tok[data-i]");
  const tm = e.target.closest && e.target.closest(".term");
  document.querySelectorAll(".tok.sel").forEach(x => x.classList.remove("sel"));
  if (tk && current) { tk.classList.add("sel"); const r = tk.getBoundingClientRect(); showTip(tokenTip(tk), r.left, r.bottom - 10); }
  else if (tm) { const [n, d] = STR[lang].terms[tm.dataset.term]; const r = tm.getBoundingClientRect(); showTip(`<div class="t">${n}</div><div style="color:var(--ink-2)">${d}</div>`, r.left, r.bottom - 10, "term"); }
  else tip().style.display = "none";
});

// ---------------------------------------------------------------- tasks
function drawTasks() {
  const D = DATA, TK = D.tasks, c = D.candidates[+$("#tcand").value], name = c.model.spec.name;
  const ref = TK.runs[D.reference.spec.name], runs = TK.runs[name], mode = $("#tfilter").value;
  const idx = TK.items.map((_, i) => i).filter(i => mode === "all" ? true : mode === "diff" ? runs[i].diverge_at != null : runs[i].correct !== ref[i].correct);
  $("#tcount").textContent = T("showing", { k: idx.length, n: TK.items.length });
  const verdict = ok => ok ? `<span class="ok">${T("right")}</span>` : `<span class="bad">${T("wrong")}</span>`;
  const ans = (text, cut) => { const ch = [...text], a = ch.slice(0, cut).join(""), b = ch.slice(cut).join(""); return `<div class="ans">${esc(a)}${b ? `<mark>${esc(b)}</mark>` : ""}</div>`; };
  $("#tasklist").innerHTML = idx.length ? idx.map(i => {
    const t = TK.items[i], r = ref[i], q = runs[i];
    return `<div class="qa"><div class="q">${esc(t.prompt)}</div><div class="exp">${T("expected")}: <b class="mono" style="color:var(--ink)">${esc(t.answer)}</b> · ${esc(cat(t.category))}</div>
      <div class="cols"><div><div class="who">${esc(D.reference.spec.name)} · ${verdict(r.correct)}</div>${ans(r.text, Infinity)}</div>
      <div><div class="who">${esc(name)} · ${verdict(q.correct)}</div>${ans(q.text, q.same_prefix_chars)}</div></div></div>`;
  }).join("") : `<p class="muted">${T("none_changed")}</p>`;
}

// ---------------------------------------------------------------- nerds
function nerdHTML() {
  const D = DATA, R = D.reference, C = D.candidates, ST = D.stats;
  const anyBench = [R, ...C.map(c => c.model)].some(m => m.bench);
  const energy = D.energy_available && [R, ...C.map(c => c.model)].some(m => m.bench && m.bench.energy_mj_per_tok != null);
  const bc = m => anyBench ? (m.bench ? `<td class="mono">${nice(m.bench.prefill_tok_s)}</td><td class="mono">${nice(m.bench.decode_tok_s)}</td><td class="mono">${m.bench.mem_bytes ? gb(m.bench.mem_bytes) : "–"}</td>` : "<td>–</td><td>–</td><td>–</td>") : "";
  const ec = m => energy ? `<td class="mono">${m.bench && m.bench.energy_mj_per_tok != null ? m.bench.energy_mj_per_tok.toFixed(1) + " mJ" : "–"}</td>` : "";
  let h = `<h3>${T("n_table")}</h3><div class="scroll"><table><thead><tr><th>model</th><th>size</th><th>KL mean</th><th>KL p99</th><th>top-1</th><th>confident flips</th><th>PPL</th><th>ΔPPL</th>
    ${anyBench ? "<th>prefill t/s</th><th>decode t/s</th><th>memory</th>" : ""}${energy ? "<th>energy/token</th>" : ""}<th>tier</th></tr></thead><tbody>
    <tr><td><span class="sw" style="background:var(--muted)"></span>${esc(R.spec.name)}</td><td class="mono">${gb(R.info.size_bytes)}</td><td class="mono muted">0</td><td class="mono muted">0</td><td class="mono muted">100%</td><td class="mono muted">0</td><td class="mono">${R.ppl.toFixed(3)}</td><td class="mono muted">0</td>${bc(R)}${ec(R)}<td class="muted">reference</td></tr>
    ${C.map((c, i) => { const s = c.summary; return `<tr><td><span class="sw" style="background:${series(i)}"></span>${esc(c.model.spec.name)}${c.pareto ? ' <span class="muted">◆</span>' : ""}</td><td class="mono">${gb(c.model.info.size_bytes)}</td><td class="mono">${fmtKL(s.kl_mean)}</td><td class="mono">${s.kl_p99.toFixed(3)}</td><td class="mono">${pct(s.top1_agreement)}</td><td class="mono">${s.confident_flips}</td><td class="mono">${s.ppl_cand.toFixed(3)}</td><td class="mono">${s.ppl_delta_pct >= 0 ? "+" : ""}${s.ppl_delta_pct.toFixed(2)}%</td>${bc(c.model)}${ec(c.model)}<td style="color:${QCOL[c.tier]}">${c.tier.replace("_", "-")}</td></tr>`; }).join("")}
    </tbody></table></div><p class="note">◆ Pareto-optimal: no other version is both smaller and closer to the original.</p>`;
  if (ST) {
    const ci = (i, f) => `${f(i.est)} <span class="muted">[${f(i.lo)}–${f(i.hi)}]</span>`;
    h += `<h3>${T("n_ci")}</h3><p class="note">${ST.replicates} paired bootstrap resamples, prompt tokens in ${ST.block_tokens}-token blocks, tasks individually.</p><div class="scroll"><table><thead><tr><th>model</th><th>KL mean</th><th>top-1</th>${ST.candidates[0] && ST.candidates[0].accuracy ? "<th>accuracy</th><th>broken share</th>" : ""}${ST.candidates[0] && ST.candidates[0].p_change ? "<th>P(answer changes)</th>" : ""}</tr></thead><tbody>
      ${ST.candidates.map(c => `<tr><td>${esc(c.name)}</td><td class="mono">${ci(c.kl_mean, fmtKL)}</td><td class="mono">${ci(c.top1, x => pct(x))}</td>${c.accuracy ? `<td class="mono">${ci(c.accuracy, x => pct(x, 0))}</td><td class="mono">${ci(c.broken_rate, x => pct(x, 0))}</td>` : ""}${c.p_change ? `<td class="mono">${ci(c.p_change, x => pct(x, 0))}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>
      <div class="scroll" style="margin-top:14px"><table><thead><tr><th>pair</th><th>Δ KL mean</th>${ST.pairs[0] && ST.pairs[0].acc_diff ? "<th>Δ accuracy</th>" : ""}</tr></thead><tbody>
      ${ST.pairs.map(p => `<tr><td>${esc(p.smaller)} − ${esc(p.larger)}</td><td class="mono">${ci(p.kl_diff, x => (x >= 0 ? "+" : "") + x.toFixed(4))}</td>${p.acc_diff ? `<td class="mono">${ci(p.acc_diff, x => (x >= 0 ? "+" : "") + (x * 100).toFixed(0) + "%")}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>`;
  }
  h += `<div class="grid2" style="margin-top:8px"><div><h3>${T("n_size")}</h3><p class="note">${T("n_size_note")}</p><div id="scatter"></div></div>
    <div><h3>${T("n_cdf")}</h3><p class="note">${T("n_cdf_note")}</p><div id="cdf"></div></div></div>`;
  if (D.calibration) {
    const cal = D.calibration;
    h += `<h3>${T("n_cal")}</h3><p class="note">${T("n_cal_note", { levels: cal.levels.map(p => pct(p, 0)).join(", ") })}
      logit P = ${cal.a.toFixed(2)} + ${cal.b.toFixed(2)}·ln KL, n = ${cal.n} (${esc(cal.outcome)}).</p><div id="calib"></div>`;
  } else if (D.calibration_note) {
    h += `<p class="note">Calibration skipped: ${esc(D.calibration_note)}.</p>`;
  }
  h += `<h3>${T("n_worst")}</h3><div class="controls"><select id="wcand">${C.map((c, i) => `<option value="${i}">${esc(c.model.spec.name)}</option>`).join("")}</select></div><div id="worst" class="grid2"></div>`;
  h += `<h3>${T("n_method")}</h3><div class="method">
    <p>Teacher forcing: every prompt is tokenized once by the reference and the same token ids go through every model, so positions line up exactly. At each position the reference keeps its top-${D.settings.top_k} tokens; each quant reports its log-probabilities for exactly those, and the rest of the vocabulary is pooled into one tail bucket on both sides. The KL divergence of these (k+1)-bucket distributions is a lower bound on the full-vocabulary KL and is tight when the reference tail is small.</p>
    <p>Top-1 agreement counts positions where both rank the same token first; a confident flip is a disagreement where the reference was over 50% sure. Tasks are answered greedily (up to ${D.tasks ? D.tasks.gen_tokens : "–"} tokens) from identical prompt ids and graded automatically: numeric tasks take the last number in the output, text tasks look for the expected word near the start.</p>
    ${D.energy_available ? `<p>Energy: SoC package energy (CPU + GPU + ANE + DRAM) from IOReport during decoding, minus an idle baseline of ${D.idle_watts ? D.idle_watts.toFixed(2) + " W" : "–"}.</p>` : ""}
    <p>Tier boundaries${D.calibration ? " (calibrated)" : " (defaults)"}: near-lossless &lt; ${fmtKL(D.thresholds.near_lossless)}, excellent &lt; ${fmtKL(D.thresholds.excellent)}, noticeable &lt; ${fmtKL(D.thresholds.noticeable)} nats. Reference <code>${esc(D.reference.spec.path)}</code> on ${esc(D.reference.info.device)}.</p></div>`;
  return h;
}

function drawNerdCharts() {
  drawScatter(); drawCDF(); if ($("#calib")) drawCalib();
  $("#wcand").onchange = drawWorst; drawWorst();
}

function frame(w, hgt, m) { return { w, h: hgt, m, iw: w - m.l - m.r, ih: hgt - m.t - m.b }; }
function logTicks(lo, hi) { const t = []; for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) t.push(Math.pow(10, e)); return t.filter(v => v >= lo * 0.999 && v <= hi * 1.001); }
const tickLbl = t => t >= 1 ? String(t) : t.toExponential(0);
function niceTicks(max, n = 4) { const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw); const t = []; for (let v = 0; v <= max + 1e-9; v += step) t.push(v); return t; }

function drawScatter() {
  const C = DATA.candidates, f = frame(520, 300, { l: 54, r: 18, t: 14, b: 40 });
  const xs = [DATA.reference.info.size_bytes, ...C.map(c => c.model.info.size_bytes)], ys = C.map(c => Math.max(c.summary.kl_mean, 1e-5));
  const xt = niceTicks(Math.max(...xs) * 1.05), x1 = Math.max(xt[xt.length - 1], Math.max(...xs) * 1.05);
  const y0 = Math.pow(10, Math.floor(Math.log10(Math.min(...ys)))), y1 = Math.pow(10, Math.ceil(Math.log10(Math.max(...ys) * 1.01)));
  const X = v => f.m.l + v / x1 * f.iw, Y = v => f.m.t + f.ih - (Math.log10(v) - Math.log10(y0)) / (Math.log10(y1) - Math.log10(y0)) * f.ih;
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" width="100%">`;
  for (const t of logTicks(y0, y1)) s += `<line class="grid" x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${f.m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${tickLbl(t)}</text>`;
  for (const v of xt) s += `<text x="${X(v)}" y="${f.h - 20}" text-anchor="middle">${v ? gb(v) : "0"}</text>`;
  s += `<text x="${f.m.l + f.iw / 2}" y="${f.h - 3}" text-anchor="middle">size</text>`;
  const rx = X(DATA.reference.info.size_bytes);
  s += `<line x1="${rx}" x2="${rx}" y1="${f.m.t}" y2="${f.m.t + f.ih}" stroke="${css("--muted")}" stroke-dasharray="4 4"/><text x="${rx - 4}" y="${f.m.t + 10}" text-anchor="end">${esc(DATA.reference.spec.name)}</text>`;
  const par = C.filter(c => c.pareto).sort((a, b) => a.model.info.size_bytes - b.model.info.size_bytes);
  if (par.length > 1) s += `<polyline fill="none" stroke="${css("--ink-2")}" stroke-opacity="0.5" stroke-width="1.5" points="${par.map(c => X(c.model.info.size_bytes) + "," + Y(Math.max(c.summary.kl_mean, 1e-5))).join(" ")}"/>`;
  C.forEach((c, i) => { const cx = X(c.model.info.size_bytes), cy = Y(Math.max(c.summary.kl_mean, 1e-5)); s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${series(i)}"/><text class="lbl" x="${cx + 10}" y="${cy + 4}">${esc(c.model.spec.name)}</text>`; });
  $("#scatter").innerHTML = s + "</svg>";
}

function drawCDF() {
  const C = DATA.candidates, f = frame(520, 300, { l: 44, r: 18, t: 14, b: 40 });
  const ser = C.map(c => { const v = []; for (const d of DATA.docs) { const dc = d.cands[c.model.spec.name]; if (dc) v.push(...dc.kl); } return v.map(x => Math.max(x, 1e-6)).sort((a, b) => a - b); });
  const all = ser.flat(); if (!all.length) return;
  const lo = Math.max(1e-5, Math.pow(10, Math.floor(Math.log10(Math.max(all[Math.floor(all.length * 0.02)], 1e-5))))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...all))));
  const X = v => f.m.l + (Math.log10(Math.min(Math.max(v, lo), hi)) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * f.iw, Y = p => f.m.t + f.ih - p * f.ih;
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" width="100%">`;
  for (const p of [0, 0.25, 0.5, 0.75, 1]) s += `<line class="grid" x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${f.m.l - 8}" y="${Y(p) + 4}" text-anchor="end">${p * 100}%</text>`;
  for (const t of logTicks(lo, hi)) s += `<text x="${X(t)}" y="${f.h - 20}" text-anchor="middle">${tickLbl(t)}</text>`;
  s += `<text x="${f.m.l + f.iw / 2}" y="${f.h - 3}" text-anchor="middle">per-token KL (log)</text>`;
  ser.forEach((v, i) => { const n = v.length, step = Math.max(1, Math.floor(n / 300)), pts = []; for (let j = 0; j < n; j += step) pts.push(X(v[j]) + "," + Y((j + 1) / n)); pts.push(X(v[n - 1]) + "," + Y(1)); s += `<polyline fill="none" stroke="${series(i)}" stroke-width="2" points="${pts.join(" ")}"/>`; });
  s += C.map((c, i) => `<text class="lbl" x="${f.w - f.m.r}" y="${f.m.t + f.ih - 8 - i * 16}" text-anchor="end" style="fill:${series(i)}">${esc(c.model.spec.name)}</text>`).join("");
  $("#cdf").innerHTML = s + "</svg>";
}

function drawCalib() {
  const CAL = DATA.calibration, C = DATA.candidates, f = frame(1040, 320, { l: 56, r: 24, t: 18, b: 44 });
  const kls = CAL.points.map(p => p.kl).concat(CAL.kl_at, C.map(c => Math.max(c.summary.kl_mean, 1e-6)));
  const lo = Math.pow(10, Math.floor(Math.log10(Math.max(Math.min(...kls), 1e-6)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...kls))));
  const X = v => f.m.l + (Math.log10(Math.max(v, lo)) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) * f.iw, Y = p => f.m.t + f.ih - p * f.ih;
  const P = kl => 1 / (1 + Math.exp(-(CAL.a + CAL.b * Math.log(Math.max(kl, 1e-6)))));
  const ci = Object.fromEntries(C.map((c, i) => [c.model.spec.name, i]));
  let s = `<svg viewBox="0 0 ${f.w} ${f.h}" width="100%">`;
  for (const p of [0, 0.25, 0.5, 0.75, 1]) s += `<line class="grid" x1="${f.m.l}" x2="${f.w - f.m.r}" y1="${Y(p)}" y2="${Y(p)}"/><text x="${f.m.l - 8}" y="${Y(p) + 4}" text-anchor="end">${p * 100}%</text>`;
  for (const t of logTicks(lo, hi)) s += `<text x="${X(t)}" y="${f.h - 22}" text-anchor="middle">${tickLbl(t)}</text>`;
  s += `<text x="${f.m.l + f.iw / 2}" y="${f.h - 4}" text-anchor="middle">KL on the original's answer (log)</text>`;
  const bands = [[lo, CAL.kl_at[0], "--q0"], [CAL.kl_at[0], CAL.kl_at[1], "--q1"], [CAL.kl_at[1], CAL.kl_at[2], "--q2"], [CAL.kl_at[2], hi, "--q3"]];
  bands.forEach(([a, b, col]) => { const xa = X(a), xb = X(b); if (xb - xa > 1) s += `<rect x="${xa}" y="${f.m.t + f.ih + 4}" width="${xb - xa}" height="4" fill="var(${col})"/>`; });
  CAL.kl_at.forEach((k, i) => s += `<line x1="${X(k)}" x2="${X(k)}" y1="${f.m.t}" y2="${f.m.t + f.ih}" stroke="${css("--muted")}" stroke-dasharray="3 4"/><text x="${X(k) + 4}" y="${f.m.t + 12}">${pct(CAL.levels[i], 0)}</text>`);
  CAL.points.forEach((p, j) => { const jit = ((j * 9301 + 49297) % 233280) / 233280 * 0.06 - 0.03; s += `<circle cx="${X(p.kl)}" cy="${Y(p.changed ? 0.96 + jit : 0.04 + jit)}" r="3" fill="${series(ci[p.candidate] ?? 0)}" opacity="0.7"/>`; });
  const pts = []; for (let i = 0; i <= 200; i++) { const kl = Math.pow(10, Math.log10(lo) + (Math.log10(hi) - Math.log10(lo)) * i / 200); pts.push(X(kl) + "," + Y(P(kl))); }
  s += `<polyline fill="none" stroke="${css("--ink")}" stroke-width="2" points="${pts.join(" ")}"/>`;
  C.forEach((c, i) => { const kl = Math.max(c.summary.kl_mean, 1e-6), x = X(kl), y = Y(P(kl)); s += `<circle cx="${x}" cy="${y}" r="7" fill="${series(i)}" stroke="#0a0a0a" stroke-width="2"/><text class="lbl" x="${x + 10}" y="${y - 8}">${esc(c.model.spec.name)} ~${pct(P(kl), 0)}</text>`; });
  $("#calib").innerHTML = s + "</svg>";
}

function drawWorst() {
  const c = DATA.candidates[+$("#wcand").value];
  $("#worst").innerHTML = c.worst.map(w => {
    const d = DATA.docs[w.doc];
    return `<div class="panel" style="padding:16px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span class="muted">${esc(cat(d.category))} · ${esc(d.name)}</span><span class="mono bad">KL ${w.kl.toFixed(3)}</span></div>
      <div class="ans mono" style="font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word">…${esc(w.context)}<mark style="background:rgba(var(--heat),.28);color:var(--ink)">${esc(w.actual)}</mark></div>
      <div class="cols" style="margin-top:10px"><div><div class="muted" style="font-size:12px">${esc(DATA.reference.spec.name)}</div>${alts(w.ref_top, w.actual)}</div><div><div class="muted" style="font-size:12px">${esc(c.model.spec.name)}</div>${alts(w.cand_top, w.actual)}</div></div></div>`;
  }).join("");
}

if (DATA) render(); else document.body.innerHTML = "<p style='padding:40px'>No data embedded.</p>";
</script>
</body>
</html>
