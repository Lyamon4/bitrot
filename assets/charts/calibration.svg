<text x="28" y="40" fill="#f2f2f0" font-size="19" font-weight="500">Calibrated tiers: how much drift changes an answer</text>
<text x="28" y="64" fill="#85857f" font-size="13.5">Each dot is one answer by one quant (150 in total). The curve is a logistic fit; the tier boundaries sit where it crosses 2%, 5% and 15%.</text>
